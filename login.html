<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lazarus — Login</title>
<style>:root{--paper:#f6f3ea;--green:#1a7f37;--green-deep:#0f5d28;--ink:#1c2430;--dim:#5a6472;--red:#c62f2f;--line:#e3ded0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);display:flex;justify-content:center;align-items:center;min-height:100vh;}
.login-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:40px;width:100%;max-width:360px;text-align:center;border-top:4px solid var(--green);}
.login-box h1{font-size:1.5rem;margin-bottom:8px;} .login-box p{color:var(--dim);font-size:.85rem;margin-bottom:24px;}
.login-box input{width:100%;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:1rem;margin-bottom:12px;min-height:44px;}
.login-box input:focus{outline:none;border-color:var(--green);}
.login-box button{width:100%;padding:12px;background:var(--green);border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;min-height:44px;}
.login-box button:hover{background:var(--green-deep);}
.error{color:var(--red);font-size:.85rem;margin-top:12px;display:none;}
</style></head><body>
<div class="login-box"><h1>The Lazarus</h1><p>Enter the password to open the season dashboard</p>
<input type="password" id="pw" placeholder="Password" autofocus>
<button id="go">Open</button><div class="error" id="err">Wrong password</div></div>
<script>
const PASS_HASH="96ea3f27991176f7616716d0ee8f9cde44f7bb3aa62ebf7b0208576acb0ec0a9";
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
document.getElementById('go').addEventListener('click',async()=>{const hh=await sha256(document.getElementById('pw').value);if(hh===PASS_HASH){sessionStorage.setItem('lz_auth','1');window.location.href='index.html';}else{document.getElementById('err').style.display='block';}});
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
</script></body></html>
